services:
  dotto:
    container_name: dotto
    image: "ghcr.io/2048khz-gachi-rmx/dotto:latest"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      socket-protector:
        condition: service_started
      sandbox-image:
        condition: service_completed_successfully
      sandbox-firewall:
        condition: service_healthy
    networks:
      - dotto
      - docker_socket
    volumes:
      # yt-dlp refreshes cookies, so this is read-write.
      - ./dotto_resources:/app/resources
      # Same host path on both sides: the daemon resolves bind sources host-side.
      - /var/lib/dotto-sandbox:/var/lib/dotto-sandbox
      - /var/lib/dotto-sandbox-ipc:/var/lib/dotto-sandbox-ipc
    environment:
      # Bot__InstanceName: "dotto"        # multiple bots sharing a database
      # Bot__OwnerIds__0: "YOUR_USER_ID"  # defaults to the application owner
      ConnectionString: "User ID=${POSTGRES_USER}; Password=${POSTGRES_PASSWORD}; Host=postgres; Port=5999; Database=dotto"
      # Optional; see ./dotto_resources above.
      Downloader__CookieFile: "/app/resources/ytdlp-cookies.txt"
      # All Docker API calls go through the filtered socket proxy.
      DOCKER_HOST: "tcp://socket-protector:2375"
      # Pulled by sandbox-image below; the proxy does not allow pulls.
      Ai__Sandbox__ImageTag: "ghcr.io/2048khz-gachi-rmx/dotto-sandbox:latest"
      # Persistent storage and per-session control sockets.
      Ai__Sandbox__StorageBasePath: "/var/lib/dotto-sandbox"
      Ai__Sandbox__IpcBasePath: "/var/lib/dotto-sandbox-ipc"
      # Selects the Unix-socket transport and the sandbox network; the bot is not a member.
      Ai__Sandbox__NetworkName: "sandbox"

  # Pre-pulls the sandbox image (pulls are not whitelisted by the proxy).
  sandbox-image:
    image: ghcr.io/2048khz-gachi-rmx/dotto-sandbox:latest
    container_name: dotto_sandbox_image
    entrypoint: ["echo", "sandbox image present"]
    restart: "no"
    networks:
      - sandbox

  # Applies the sandbox bridge's internet-only egress rules.
  sandbox-firewall:
    container_name: dotto_sandbox_firewall
    image: ghcr.io/2048khz-gachi-rmx/dotto-sandbox-firewall:latest
    network_mode: host
    read_only: true
    tmpfs:
      - /run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      SANDBOX_BRIDGE: "br-sandbox"
    restart: unless-stopped

  # Filters Docker API calls to the sandbox lifecycle endpoints.
  socket-protector:
    container_name: dotto_socket_protector
    image: ghcr.io/2048khz-gachi-rmx/dotto-socket-protector:latest
    hostname: socket-protector
    read_only: true
    cap_drop:
      - ALL
    environment:
      LOG_REQUESTS: "false"
      PROFILE: "dotto"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - docker_socket
    mem_limit: 32mb
    restart: unless-stopped

  postgres:
    container_name: dotto_postgres
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: 'dotto'
      PGDATA: /data/postgres
      PGPORT: 5999
    volumes:
       - postgres:/data/postgres
    ports:
      # Loopback only; sandboxes may reach it only through the published port.
      - "127.0.0.1:${POSTGRES_PUBLIC_PORT}:5999"
    networks:
      - dotto
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  dotto:
  docker_socket:
    internal: true
  # Pinned bridge/subnet; ICC off and the bot is not a member (it uses sockets).
  # ICC is creation-time: recreate the network after changing driver_opts.
  sandbox:
    name: sandbox
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-sandbox
      com.docker.network.bridge.enable_icc: "false"
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${SANDBOX_SUBNET:-10.213.0.0/24}

volumes:
    postgres: