name: Build Docker container

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  # i don't think pull_request should be here... but i do want to run tests on PRs. maybe later?
  # pull_request:

env:
  # Ryuk (Testcontainers' resource reaper) exists to clean up containers on a
  # long-lived host. On an ephemeral CI runner it only costs an extra image pull
  # and container start, so skip it.
  TESTCONTAINERS_RYUK_DISABLED: "true"
  # Must match PostgreSqlBuilder's default image in Dotto.Tests/TestContainers.cs
  POSTGRES_TEST_IMAGE: postgres:15.1

jobs:
  test:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    # The ubuntu runner image already ships .NET 10 SDKs (10.0.112/204/303/401).
    # actions/setup-dotnet resolves "10.0.x" to the newest channel release
    # (10.0.402), which is NOT preinstalled, so it downloads a 240 MB SDK +
    # 36 MB runtime on every run (~10s). global.json picks the installed SDK
    # instead. Print it so a missing SDK fails loudly.
    - name: Show .NET SDK
      run: dotnet --info

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json', 'global.json') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: |
        # Warm the test database image in the background so the Test step
        # doesn't pay the ~9s registry pull serially. postgres:15.1 is what
        # Dotto.Tests/TestContainers.cs uses.
        docker pull -q "$POSTGRES_TEST_IMAGE" &
        pull_pid=$!
        dotnet build --no-restore -m
        # Don't fail the build if the pull hiccups; Testcontainers would retry it.
        wait "$pull_pid" || true

    - name: Test
      run: dotnet test --no-build --verbosity normal

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    needs: test

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/2048khz-gachi-rmx/dotto

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bot
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          # Persist buildkit layers (incl. the runtime stage + nuget restore)
          # in the GitHub Actions cache so subsequent builds reuse them.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false