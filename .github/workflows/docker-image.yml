name: Build Docker container

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  # i don't think pull_request should be here... but i do want to run tests on PRs. maybe later?
  # pull_request:

env:
  # Ryuk (Testcontainers' resource reaper) exists to clean up containers on a
  # long-lived host. On an ephemeral CI runner it only costs an extra image pull
  # and container start, so skip it.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        # Cache ~/.nuget/packages, keyed on the project files. Restore then
        # runs offline instead of re-downloading every package each run.
        cache: true
        cache-dependency-path: |
          **/*.csproj
          **/packages.lock.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/2048khz-gachi-rmx/dotto

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bot
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          # Persist buildkit layers (incl. the runtime stage + nuget restore)
          # in the GitHub Actions cache so subsequent builds reuse them.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false